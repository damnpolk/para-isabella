<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Para Isabella ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#050505;color:#fff;font-family:Segoe UI,Arial,sans-serif}#app{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;z-index:2}.card{max-width:900px;width:100%}h1{font-size:clamp(36px,7vw,68px);margin:0 0 18px}p{font-size:clamp(20px,3vw,30px);line-height:1.5;margin:12px 0}.final{white-space:pre-line}.small{font-size:18px;color:#999}.lang{font-size:22px;color:#aaa;margin-bottom:22px}.love{font-size:clamp(34px,6vw,58px);font-weight:700}.count{color:#777;margin-top:28px;font-size:15px}button{margin-top:35px;padding:16px 30px;border:0;border-radius:999px;font-size:20px;font-weight:700;cursor:pointer;background:#fff;color:#111}button:hover{transform:scale(1.04)}.fade{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.heart{position:fixed;bottom:-40px;left:0;color:#e11;font-size:24px;pointer-events:none;animation:rise linear forwards;z-index:1}@keyframes rise{from{transform:translateY(0) rotate(0deg);opacity:.8}to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style></head>
<body><div id="app"><div class="card" id="content"><h1>Isabella...</h1><p>Você recebeu uma mensagem ❤️</p><button onclick="start()">Abrir minha mensagem ❤️</button></div></div>
<script>
const frases=[["Português","Eu te amo ❤️"],["Inglês","I love you ❤️"],["Espanhol","Te amo ❤️"],["Francês","Je t'aime ❤️"],["Italiano","Ti amo ❤️"],["Alemão","Ich liebe dich ❤️"],["Japonês","愛してる ❤️"],["Coreano","사랑해 ❤️"],["Chinês","我爱你 ❤️"],["Russo","Я тебя люблю ❤️"],["Árabe","أحبك ❤️"],["Hindi","मैं तुमसे प्यार करता हूँ ❤️"],["Grego","Σ' αγαπώ ❤️"],["Turco","Seni seviyorum ❤️"],["Holandês","Ik hou van jou ❤️"],["Sueco","Jag älskar dig ❤️"],["Norueguês","Jeg elsker deg ❤️"],["Dinamarquês","Jeg elsker dig ❤️"],["Finlandês","Rakastan sinua ❤️"],["Polonês","Kocham cię ❤️"],["Tcheco","Miluji tě ❤️"],["Eslovaco","Ľúbim ťa ❤️"],["Húngaro","Szeretlek ❤️"],["Romeno","Te iubesc ❤️"],["Búlgaro","Обичам те ❤️"],["Ucraniano","Я тебе кохаю ❤️"],["Croata","Volim te ❤️"],["Sérvio","Волим те ❤️"],["Esloveno","Ljubim te ❤️"],["Bósnio","Volim te ❤️"],["Albanês","Të dua ❤️"],["Islandês","Ég elska þig ❤️"],["Irlandês","Is breá liom tú ❤️"],["Galês","Rwy'n dy garu di ❤️"],["Latim","Te amo ❤️"],["Hebraico","אני אוהב אותך ❤️"],["Persa","دوستت دارم ❤️"],["Armênio","Ես սիրում եմ քեզ ❤️"],["Georgiano","მიყვარხარ ❤️"],["Vietnamita","Anh yêu em ❤️"],["Tailandês","ฉันรักคุณ ❤️"],["Indonésio","Aku cinta kamu ❤️"],["Malaio","Saya cintakan awak ❤️"],["Filipino","Mahal kita ❤️"],["Suaíli","Nakupenda ❤️"],["Africâner","Ek is lief vir jou ❤️"],["Esperanto","Mi amas vin ❤️"],["Estoniano","Ma armastan sind ❤️"],["Letão","Es tevi mīlu ❤️"],["Lituano","Aš tave myliu ❤️"]];
const content=document.getElementById('content');function heart(){const h=document.createElement('div');h.className='heart';h.textContent='♥';h.style.left=Math.random()*100+'vw';h.style.fontSize=14+Math.random()*24+'px';h.style.animationDuration=4+Math.random()*5+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),9000)}setInterval(heart,180);
function show(html,ms){content.className='card fade';content.innerHTML=html;return new Promise(r=>setTimeout(r,ms))}
async function start(){await show('<h1>Isabella...</h1>',1600);await show('<p>Eu preparei uma pequena surpresa para você.</p>',2200);await show('<p>Existem muitas maneiras de dizer o que eu sinto...</p>',2200);for(let i=0;i<frases.length;i++){await show(`<div class="lang">${frases[i][0]}</div><div class="love">${frases[i][1]}</div><div class="count">${i+1} / ${frases.length}</div>`,1050)}await show('<p>Mas sabe o que é mais bonito?</p>',2200);await show('<p>Não importa em qual idioma eu diga...</p>',2200);await show('<p>o significado continua sendo o mesmo.</p>',2200);await show('<div class="love">EU TE AMO ❤️</div>',3200);content.innerHTML='<h1>Isabella ❤️</h1><p class="final">Eu poderia escrever milhares de palavras,\naprender todos os idiomas do mundo\ne ainda assim não conseguiria explicar\ncompletamente o quanto eu amo você.</p><p><b>Obrigado por existir na minha vida. ❤️</b></p><p class="small">— Daniel ❤️</p>'}
</script></body></html>
